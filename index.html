<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--=============== FAVICON ===============-->
    <link rel="shortcut icon" href="assets/img/favicon.png" type="image/x-icon">

    <!--=============== REMIXICONS ===============-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.css">

    <!--=============== CSS ===============-->
    <link rel="stylesheet" href="assets/css/styles.css">

    <title>SPARROW</title>
</head>
<body>
    <!--==================== HEADER ====================-->
    <header class="header" id="header">
        <nav class="nav container">
            <a href="#" class="nav_logo">
                <i class="ri-anchor-fill"></i>
                <span>SPARROW</span>
            </a>

            <div class="nav_menu" id="nav-menu">
                <ul class="nav_list">
                    <li><a href="#" class="nav_link">HOME</a></li>
                    <li><a href="#" class="nav_link">EXPLORE</a></li>
                    <li><a href="#" class="nav_link">CARIBBEAN</a></li>
                    <li><a href="#" class="nav_link">CONTACT</a></li>
                </ul>

                <!-- Close button -->
                <div class="nav_close" id="nav-close">
                    <i class="ri-close-large-line"></i>
                </div>
            </div>

            <!-- Toggle button -->
            <div class="nav_toggle" id="nav-toggle">
                <i class="ri-menu-line"></i>
            </div>
        </nav>
    </header>

    <!--==================== MAIN CONTENT ====================-->
    <main class="main">
        <!--==================== HOME ====================-->
        <section class="home">
            <div class="home_container container">
                <img src="assets/img/cloud.svg" alt="image" class="home_cloud-1">
                <img src="assets/img/cloud.svg" alt="image" class="home_cloud-2">

                <div class="home_data">
                    <h3 class="home_subtitle">NEW PIRATE</h3>
                    <h1 class="home_title">
                        <span>LEGEND OF</span> <br>
                        THE SEAS
                    </h1>
                    <a href="#" class="home_button">EXPLORE NOW</a>
                </div>

                <div class="home_images">
                    <div class="home_waves-3" style="background-image: url(assets/img/waves-3.png);"></div>
                    <div class="home_waves-2" style="background-image: url(assets/img/waves-2.png);"></div>
                    <img src="assets/img/pirate-ship.svg" alt="image" class="home_ship">
                    <div class="home_waves-1" style="background-image: url(assets/img/waves-1.png);"></div>
                </div>
            </div>
        </section>
    </main>

    <!--=============== MAIN JS ===============-->
    <script src="assets/js/main.js"></script>
</body>
</html>
